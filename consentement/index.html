<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Backspace</title>
<meta name="robots" content="noindex">
<link rel="canonical" href="../fr/consentement/">
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 2.5rem 1.25rem 5rem;
    font: 16px/1.65 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: #14161B;
    background: #F4F5F7;
  }
  main { max-width: 44rem; margin: 0 auto; }
  h1 { font-size: 1.9rem; line-height: 1.25; margin: 0 0 .4rem; letter-spacing: -.02em; }
  h2 { font-size: 1.2rem; margin: 2.4rem 0 .6rem; letter-spacing: -.01em; }
  p, li { margin: 0 0 .9rem; }
  ul { padding-inline-start: 1.2rem; }
  a { color: #3B3BE8; }
  code {
    font: .92em ui-monospace, SFMono-Regular, Menlo, monospace;
    background: rgba(0,0,0,.05); padding: .1em .35em; border-radius: 4px;
  }
  strong { font-weight: 650; }
  .chapeau { color: #555C66; font-size: .95rem; margin-bottom: 2rem; }
  .chapeau b { color: #14161B; font-weight: 600; }
  .reserve {
    border-inline-start: 3px solid #3B3BE8;
    padding: .7rem 1rem; margin: 0 0 2rem;
    background: rgba(59,59,232,.06); font-size: .95rem; border-radius: 0 6px 6px 0;
  }
  nav { margin-top: 3rem; font-size: .9rem; line-height: 2.1; }
  nav b { display: block; font-weight: 600; margin-bottom: .2rem; }
  nav a { margin-inline-end: .9rem; white-space: nowrap; }
  footer { margin-top: 2rem; font-size: .9rem; color: #555C66; }
  @media (prefers-color-scheme: dark) {
    body { color: #F4F5F7; background: #14161B; }
    .chapeau, footer { color: #9AA1AC; }
    .chapeau b { color: #F4F5F7; }
    code { background: rgba(255,255,255,.08); }
    a { color: #8F8FF2; }
    .reserve { background: rgba(143,143,242,.12); border-color: #8F8FF2; }
  }
</style>
<script>
  (function () {
    var servies = ['en', 'de', 'fr', 'es', 'pt', 'ru', 'hi', 'id', 'zh', 'ja', 'ko', 'ar'];
    var demandees = (navigator.languages || [navigator.language || 'fr']);
    for (var i = 0; i < demandees.length; i++) {
      var base = String(demandees[i]).toLowerCase().split('-')[0];
      if (servies.indexOf(base) !== -1) {
        location.replace('../' + base + '/consentement/');
        return;
      }
    }
    location.replace('../en/consentement/');
  })();
</script>
</head>
<body>
<main>
<h1>Backspace</h1>
<ul>
<li><a href="../en/consentement/" hreflang="en" lang="en">English</a></li>
<li><a href="../de/consentement/" hreflang="de" lang="de">Deutsch</a></li>
<li><a href="../fr/consentement/" hreflang="fr" lang="fr">Français</a></li>
<li><a href="../es/consentement/" hreflang="es" lang="es">Español</a></li>
<li><a href="../pt/consentement/" hreflang="pt" lang="pt">Português</a></li>
<li><a href="../ru/consentement/" hreflang="ru" lang="ru">Русский</a></li>
<li><a href="../hi/consentement/" hreflang="hi" lang="hi">हिन्दी</a></li>
<li><a href="../id/consentement/" hreflang="id" lang="id">Bahasa Indonesia</a></li>
<li><a href="../zh/consentement/" hreflang="zh" lang="zh">中文</a></li>
<li><a href="../ja/consentement/" hreflang="ja" lang="ja">日本語</a></li>
<li><a href="../ko/consentement/" hreflang="ko" lang="ko">한국어</a></li>
<li><a href="../ar/consentement/" hreflang="ar" lang="ar">العربية</a></li>
</ul>
</main>
</body>
</html>
